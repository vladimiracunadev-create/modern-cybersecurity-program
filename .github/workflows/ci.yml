name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  # Permite relanzar la validacion a mano: GitHub no siempre crea el run del
  # push (nos paso con 744e18a) y sin esto no habia forma de reejecutar CI
  # sobre un commit ya subido salvo empujando un commit vacio.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estructura:
    name: Estructura y enlaces
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validar estructura, secciones y enlaces internos
        run: python scripts/validar_estructura.py

      - name: Validar navegación bidireccional (anterior/siguiente)
        run: python scripts/generar_navegacion.py --check

      # Complementa al validador de estructura: aquel detecta enlaces rotos,
      # este detecta lo contrario — una guia de ruta que existe y no esta
      # enlazada desde ningun indice, que es invisible aunque compile.
      - name: Validar catálogo de rutas y ecosistema CISO
        run: python scripts/validar_rutas.py

      - name: Validar codificación (sin mojibake, todo UTF-8)
        run: python scripts/validar_encoding.py

      # Offline a proposito: verify-sources no toca la red. El refresco contra
      # openlibrary/crossref/csrc vive en scripts/refresh-sources, que se lanza
      # a mano y no bloquea. Si la red entrase aqui, el CI fallaria por un 503
      # ajeno al repositorio y acabariamos ignorandolo.
      - name: Validar trazabilidad de fuentes (registro, citas y cifras del README)
        run: python scripts/verify-sources

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Programa de Ciberseguridad Moderna"
            echo ""
            echo "- Partes: **$(find classes -mindepth 1 -maxdepth 1 -type d -name 'parte-*' | wc -l)**"
            echo "- Clases: **$(find classes -mindepth 3 -name README.md | wc -l)**"
          } >> "$GITHUB_STEP_SUMMARY"

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Version fijada a proposito: sin pin, npx instala la ultima y una release
      # con reglas nuevas pone el CI en rojo sin que nadie toque el repo.
      - name: Lint Markdown (markdownlint-cli2)
        run: npx --yes markdownlint-cli2@0.23.0 "**/*.md"

  generar-sitio:
    name: Build del sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias del generador
        run: python -m pip install "markdown==3.10.2"

      - name: Generar sitio (verifica que compila)
        run: python scripts/generar_sitio.py

  aplicacion-web:
    name: App web offline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verificar catálogo embebido
        run: python scripts/generar_curriculum_movil.py --check

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      - name: Exportar aplicación web
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_BASE_URL: "/app"
        run: npx expo export --platform web --output-dir dist-web

      - name: Verificar clases y recursos dentro del bundle
        run: |
          grep -q '/app/_expo/static/js/web/AppEntry-' mobile/dist-web/index.html
          BUNDLE="$(find mobile/dist-web -name 'AppEntry-*.js' | head -n1)"
          test -n "$BUNDLE"
          python scripts/verificar_bundle.py "$BUNDLE"
