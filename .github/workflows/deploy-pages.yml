name: Deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "classes/**/*.md"
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "rutas/**"
      - "autoevaluaciones/**"
      - "certificaciones/**"
      # El generador publica el arbol completo de labs/, no solo su indice: un
      # trayecto nuevo dentro de un laboratorio tambien tiene que republicar.
      - "labs/**/*.md"
      # docs/ tampoco estaba: syllabus, rubrica, examen final y la matriz de
      # roles se publican en el sitio, asi que sus cambios deben desplegarse.
      - "docs/*.md"
      - "mobile/**"
      - "ctf/README.md"
      - "manual/MANUAL.pdf"
      # Los diagramas se incrustan en las páginas: si cambian, el sitio publicado
      # se queda con los de antes hasta que otro cambio lo reconstruya.
      - "diagramas/**"
      - "scripts/generar_sitio.py"
      - "scripts/mermaid_svg.py"
      - "scripts/generar_curriculum_movil.py"
      - "scripts/verificar_bundle.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias del generador
        run: python -m pip install "markdown==3.10.2"

      - name: Generar HTML del currículo
        run: python scripts/generar_sitio.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias de la aplicación
        working-directory: mobile
        run: npm ci

      - name: Publicar aplicación web dentro de Pages
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_BASE_URL: "/modern-cybersecurity-program/app"
        run: npx expo export --platform web --output-dir ../site/app

      - name: Verificar el contenido de la aplicación web
        run: |
          grep -q '/modern-cybersecurity-program/app/_expo/static/js/web/AppEntry-' site/app/index.html
          BUNDLE="$(find site/app -name 'AppEntry-*.js' | head -n1)"
          test -n "$BUNDLE"
          python scripts/verificar_bundle.py "$BUNDLE"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
