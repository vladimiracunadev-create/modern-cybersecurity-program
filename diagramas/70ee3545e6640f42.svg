  <path class="a" d="M150 90 H185"/><path class="a" d="M315 90 H350"/><path class="a" d="M480 90 H515"/><path class="a" d="M645 90 H680"/><path class="a" d="M810 90 H845"/><path class="a" d="M975 90 H1010"/><path class="a" d="M1140 90 H1175"/>
